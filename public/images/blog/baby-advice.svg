<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A baby bottle next to a stack of diapers">
  <rect width="800" height="500" fill="#efe6d6"/>
  <rect y="360" width="800" height="140" fill="#d8c6a6"/>
  <!-- bottle -->
  <g transform="translate(250 120)">
    <rect x="34" y="0" width="52" height="36" rx="18" fill="#b8542a"/>
    <rect x="18" y="32" width="84" height="30" rx="6" fill="#b08642"/>
    <rect x="8" y="60" width="104" height="180" rx="24" fill="#fffdf8" stroke="#2a2622" stroke-width="5"/>
    <rect x="13" y="150" width="94" height="85" rx="19" fill="#f6efe3"/>
    <g stroke="#2a2622" stroke-width="4" stroke-linecap="round">
      <line x1="8" y1="100" x2="36" y2="100"/>
      <line x1="8" y1="130" x2="28" y2="130"/>
      <line x1="8" y1="160" x2="36" y2="160"/>
      <line x1="8" y1="190" x2="28" y2="190"/>
    </g>
  </g>
  <!-- diapers -->
  <g transform="translate(410 240)" stroke="#2a2622" stroke-width="5">
    <rect x="0" y="80" width="190" height="40" rx="14" fill="#fffdf8"/>
    <rect x="10" y="40" width="170" height="40" rx="14" fill="#3f6b5e"/>
    <rect x="20" y="0" width="150" height="40" rx="14" fill="#fffdf8"/>
  </g>
</svg>
